# PENPAL-COLING configuration
# All hyperparameters live here. Scripts in scripts/ are thin drivers that read
# this file; the computation lives in src/. Override the file location with
# `--config path/to/other.yaml` if you want to keep several presets side by side.

paths:
  # Inputs
  annotations: data/interim/annotations/penpal_annotations_final.csv
  # Outputs
  story_metrics: data/processed/surprisal/penpal_measures_all.csv
  window_metrics: data/processed/surprisal/surprisal_window_level.csv
  run_metadata: data/processed/surprisal/surprisal_run_metadata.json

data:
  id_col: id
  text_col: text
  condition_col: condition

  # Raw label -> analysis label
  condition_map:
    hh: HH
    ha: H-LLM
    aa: LLM-LLM
    # Cross-model LLM-LLM, from scripts/00a_simulate_cross_model.py. Inert
    # until that condition's stories exist.
    aa_cross: LLM-LLM-cross
  condition_order: [HH, H-LLM, LLM-LLM, LLM-LLM-cross]
  # Ordinal coding used for the monotone trend test. LLM-LLM-cross shares
  # code 2 with LLM-LLM: both sides are LLMs, only the pairing differs. The
  # tie means the trend test should run on one AA condition at a time -- use
  # the same-vs-cross contrast, not the trend, to compare the two.
  llmness:
    HH: 0
    H-LLM: 1
    LLM-LLM: 2
    LLM-LLM-cross: 2

  # The annotation file now contains the FULL corpus (212 stories), including
  # stories nobody has rated yet. Keeping them means the computational measures
  # and the condition contrasts run on all 212 (LLM-LLM n = 80 rather than 20),
  # while any analysis that needs ratings simply drops the NaN rows downstream.
  # Set min_annotators: 2 to restrict to the fully-annotated subset instead.
  min_annotators: 0

  # The six annotated dimensions: analysis name -> column stem in the source file.
  # Wide files carry these as mean_<stem> / ann1_<stem> / ann2_<stem>;
  # legacy long files carry them as bare <stem> with one row per annotator.
  dimensions:
    consistency: coherence_element_consistency
    coherence: coherence_logical_progression
    originality: creativity_originality
    surprisingness: creativity_surprisingness
    enjoyment: likeability_enjoyability
    quality: likeability_quality

  # Unweighted means of theoretically paired dimensions
  composites:
    coherence_comp: [consistency, coherence]
    creativity_comp: [originality, surprisingness]
    attract_comp: [enjoyment, quality]

stylometry:
  enabled: true
  # Corpus-relative semantic distinctiveness = 1 - cosine to nearest other story
  tfidf_ngram_range: [1, 2]
  tfidf_min_df: 2

surprisal:
  enabled: true

  model_name: google/gemma-4-31b
  device: auto          # auto | cuda | mps | cpu
  dtype: auto           # auto (bfloat16 on CUDA, float32 otherwise) | float32 | float16 | bfloat16
  hf_token: null        # prefer the HF_TOKEN environment variable; never commit a token

  # Window length in WORDS. 14 is deliberately sub-turn: mean turn length in the
  # source corpus is 26-28 words, so a 14-word window sits mostly inside a single
  # author's contribution. This makes the measure local by design and keeps
  # windows from straddling author transitions.
  window_words: 14
  min_window_words: 3   # drop trailing windows shorter than this

  # null = infer from the model config (n_positions / max_position_embeddings)
  max_context: null

  # Novelty is undefined for the first window and transience for the last, so
  # averaging each over its own valid range makes the three story means mutually
  # inconsistent (resonance would not equal novelty - transience). Averaging all
  # three over the common interior range keeps the identity exact.
  common_index_range: true

  save_window_level: true
  # Also export the raw surprisal terms per window, so the derived measures can
  # be audited and the novelty/transience coupling diagnosed.
  save_raw_terms: true

  progress: true

# ---------------------------------------------------------------------------
# Cross-model LLM-LLM simulation (scripts/00a_simulate_cross_model.py)
#
# The EMNLP LLM-LLM condition paired each model with itself. Here the design is
# the full model x model grid: with four models that is 16 ordered cells, four
# self-pairs and twelve cross-model ones. Order matters off the diagonal --
# the opener writes into an empty story, the responder always into someone
# else's prose -- so (A starts, B replies) and (B starts, A replies) are
# separate cells.
#
# 7 stories per cell = 112 stories. Set stories_per_pair: 6 for 96 instead;
# both are balanced. Use --n-stories to hit an exact total at the cost of
# balance.
# ---------------------------------------------------------------------------
cross_simulation:
  # 'all' = full grid including self-pairs (default), 'cross' = off-diagonal
  # cells only, 'same' = diagonal only, which reproduces the EMNLP design.
  pairing: all
  stories_per_pair: 7

  n_turns_per_story: 10
  max_turns: 10
  temperature: 1.0       # matches LLM_HYPERPARAMS.TEMPERATURE in the experiment
  max_tokens: 40         # roughly the experiment's USER_INPUT_LIMITS char range
  delay_between_stories: 2.0
  seed: 42

  # Condition code written to the story table. Kept distinct from `aa` so the
  # existing 80 same-model stories stay a separate condition and same-model vs
  # cross-model can be contrasted.
  condition: aa_cross

  paths:
    raw_turns: data/interim/stories/aa_cross_turns.csv
    story_table: data/interim/stories/ai-ai-cross_stories_full_text_filtered.csv
    id_map: data/interim/stories/aa_cross_id_map.csv
    run_metadata: data/interim/stories/aa_cross_run_metadata.json

  # Same four models as the EMNLP simulation, on the same transports.
  # Do not change these -- the point of the cross-model condition is to vary
  # the pairing, not the models.
  models:
    - id: gpt-4.1-2025-04-14
      provider: openai
      model_name: gpt-4.1-2025-04-14
      env_key: OPENAI_API_KEY

    - id: claude-sonnet-4-5-20250929
      provider: anthropic
      model_name: claude-sonnet-4-5-20250929
      base_url: https://api.anthropic.com/v1/
      env_key: ANTHROPIC_API_KEY

    - id: llama-70b
      provider: huggingface
      model_name: meta-llama/Llama-3.3-70B-Instruct
      base_url: https://router.huggingface.co/v1
      env_key: OPENROUTER_API_KEY

    - id: qwen-72b
      provider: huggingface
      model_name: Qwen/Qwen2.5-72B-Instruct
      base_url: https://router.huggingface.co/v1
      env_key: OPENROUTER_API_KEY
